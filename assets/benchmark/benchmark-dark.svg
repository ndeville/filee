<text x="605" y="208" font-size="16" font-weight="500" fill="#e6edf3">5.4 s</text>
<rect x="605" y="220" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="605" y="220" width="127.5" height="8" rx="4" fill="#3d444d"/>
