<rect x="766" y="220" width="83.8" height="8" rx="4" fill="#3d444d"/>
<text x="32" y="282" font-size="16" font-weight="600" fill="#e6edf3">Open a folder</text>
<text x="32" y="303" font-size="12.5" fill="#8d96a0">Open another 10,000-file folder</text>
<text x="282" y="282" font-size="16" font-weight="700" fill="#ff7b6b">465 ms  <tspan font-size="12.5" font-weight="600" fill="#8d96a0">1.4× faster</tspan></text>
<rect x="282" y="294" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="282" y="294" width="21.5" height="8" rx="4" fill="#f0624f"/>
<text x="444" y="282" font-size="16" font-weight="500" fill="#e6edf3">634 ms</text>
<rect x="444" y="294" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="444" y="294" width="29.3" height="8" rx="4" fill="#3d444d"/>
<text x="605" y="282" font-size="16" font-weight="500" fill="#e6edf3">2.8 s</text>
<rect x="605" y="294" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="605" y="294" width="127.5" height="8" rx="4" fill="#3d444d"/>
