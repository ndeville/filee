<rect x="444" y="442" width="59.0" height="8" rx="4" fill="#3d444d"/>
<text x="605" y="430" font-size="16" font-weight="500" fill="#e6edf3">69 MB</text>
<rect x="605" y="442" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="605" y="442" width="127.5" height="8" rx="4" fill="#3d444d"/>
<text x="766" y="430" font-size="16" font-weight="500" fill="#e6edf3">50 MB</text>
<rect x="766" y="442" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="766" y="442" width="92.9" height="8" rx="4" fill="#3d444d"/>
<text x="32" y="512" font-size="12.5" fill="#8d96a0">Time from the open command until the first files show on screen, read from screen captures by OCR. Memory as Activity Monitor shows it.</text>
<text x="32" y="532" font-size="12.5" fill="#8d96a0">Measured on 14th October 2026 with benchmark.py (github.com/ndeville/filee). Finder is part of macOS and always running.</text>
</svg>
