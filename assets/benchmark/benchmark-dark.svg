<rect x="605" y="368" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="605" y="368" width="127.5" height="8" rx="4" fill="#3d444d"/>
<text x="766" y="356" font-size="16" font-weight="500" fill="#e6edf3">208 MB</text>
<rect x="766" y="368" width="128" height="8" rx="4" fill="#30363d" opacity="0.45"/>
<rect x="766" y="368" width="102.0" height="8" rx="4" fill="#3d444d"/>
