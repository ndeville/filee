<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="959" height="563" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="52" font-size="24" font-weight="700" fill="#e6edf3">Filee, Finder, Path Finder and ForkLift</text>
<text x="32" y="80" font-size="14" fill="#8d96a0">Folders of 10,000 files · Apple M1 Ultra · macOS 26.5 · median of 5 runs · lower is better</text>
<text x="282" y="138" font-size="17" font-weight="700" fill="#ff7b6b">Filee</text>
<text x="282" y="158" font-size="12.5" fill="#8d96a0">0.1.0</text>
<text x="444" y="138" font-size="17" font-weight="700" fill="#e6edf3">Finder</text>
<text x="444" y="158" font-size="12.5" fill="#8d96a0">26.4</text>
<text x="605" y="138" font-size="17" font-weight="700" fill="#e6edf3">Path Finder</text>
<text x="605" y="158" font-size="12.5" fill="#8d96a0">26.1.9</text>
<text x="766" y="138" font-size="17" font-weight="700" fill="#e6edf3">ForkLift</text>
<text x="766" y="158" font-size="12.5" fill="#8d96a0">4.7.6</text>
<rect x="20" y="176" width="920" height="74" rx="8" fill="#151b23"/>
<text x="32" y="208" font-size="16" font-weight="600" fill="#e6edf3">Launch</text>
<text x="32" y="229" font-size="12.5" fill="#8d96a0">Start the app with a folder of 10,000 files</text>
<text x="282" y="208" font-size="16" font-weight="700" fill="#ff7b6b">1.3 s  <tspan font-size="12.5" font-weight="600" fill="#8d96a0">2.8× faster</tspan></text>
