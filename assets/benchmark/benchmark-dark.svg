<text x="32" y="451" font-size="12.5" fill="#8d96a0">On disk</text>
<text x="282" y="430" font-size="16" font-weight="700" fill="#ff7b6b">2.1 MB  <tspan font-size="12.5" font-weight="600" fill="#8d96a0">15× less</tspan></text>
