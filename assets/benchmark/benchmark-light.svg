<text x="32" y="303" font-size="12.5" fill="#656d76">Open another 10,000-file folder</text>
<text x="282" y="282" font-size="16" font-weight="700" fill="#c0392b">465 ms  <tspan font-size="12.5" font-weight="600" fill="#656d76">1.4× faster</tspan></text>
