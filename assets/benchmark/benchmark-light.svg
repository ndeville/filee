<svg xmlns="http://www.w3.org/2000/svg" width="960" height="564" viewBox="0 0 960 564" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.5" y="0.5" width="959" height="563" rx="14" fill="#ffffff" stroke="#d0d7de"/>
<text x="32" y="52" font-size="24" font-weight="700" fill="#1f2328">Filee, Finder, Path Finder and ForkLift</text>
<text x="32" y="80" font-size="14" fill="#656d76">Folders of 10,000 files · Apple M1 Ultra · macOS 26.5 · median of 5 runs · lower is better</text>
<text x="282" y="138" font-size="17" font-weight="700" fill="#c0392b">Filee</text>
<text x="282" y="158" font-size="12.5" fill="#656d76">0.1.0</text>
<text x="444" y="138" font-size="17" font-weight="700" fill="#1f2328">Finder</text>
<text x="444" y="158" font-size="12.5" fill="#656d76">26.4</text>
