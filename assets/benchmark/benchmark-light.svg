<rect x="766" y="442" width="92.9" height="8" rx="4" fill="#c4cad1"/>
<text x="32" y="512" font-size="12.5" fill="#656d76">Time from the open command until the first files show on screen, read from screen captures by OCR. Memory as Activity Monitor shows it.</text>
<text x="32" y="532" font-size="12.5" fill="#656d76">Measured on 14th October 2026 with benchmark.py (github.com/ndeville/filee). Finder is part of macOS and always running.</text>
